name: Store screenshots

# Push to the store-screenshots branch to capture 1080x1920 store screenshots.
on:
  push:
    branches: [store-screenshots]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - run: |
          mkdir -p apks/debug apks/androidTest/debug
          cp app/build/outputs/apk/debug/app-debug.apk apks/debug/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/androidTest/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on a 1080x1920 phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/store-screenshots.sh shots
      - name: Publish screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cp -r shots /tmp/s && cp shots-size.txt /tmp/s/ 2>/dev/null; cd /tmp/s
          git init -q -b store-screenshots-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Store screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" store-screenshots-output
